<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luyện Toán Nhanh</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
}

.container{
    width:100%;
    max-width:750px;
    background:#fff;
    border-radius:20px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    color:#333;
    margin-bottom:20px;
}

.settings{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:10px;
    margin-bottom:15px;
}

select,
input,
button{
    font-size:16px;
    padding:12px;
    border-radius:10px;
}

select,
input{
    border:1px solid #ccc;
}

button{
    border:none;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    opacity:.9;
    transform:translateY(-2px);
}

#levelInfo{
    text-align:center;
    margin-top:10px;
    font-weight:bold;
    color:#666;
}

.question{
    text-align:center;
    font-size:42px;
    font-weight:bold;
    color:#2c3e50;
    margin:25px 0;
}

.timer{
    margin:15px 0;
}

.timer-text{
    text-align:center;
    font-weight:bold;
    margin-bottom:8px;
}

.progress{
    width:100%;
    height:12px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    width:100%;
    height:100%;
    background:linear-gradient(90deg,#2ecc71,#27ae60);
    transition:.25s linear;
}

.answer-area{
    margin-top:20px;
}

.answer-area input{
    width:100%;
}

.check-btn{
    width:100%;
    margin-top:10px;
    background:#3498db;
    color:white;
}

.answers button{
    width:100%;
    background:#3498db;
    color:white;
    margin-top:10px;
}

.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:20px;
}

.controls button{
    flex:1;
    color:white;
}

.new-btn{
    background:#3498db;
}

.retry-btn{
    background:#f39c12;
}

.reset-btn{
    background:#e74c3c;
}

.score{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-top:20px;
}

.correct{
    color:#27ae60;
}

.wrong{
    color:#e74c3c;
}

.status{
    text-align:center;
    min-height:30px;
    margin-top:12px;
    font-weight:bold;
}

@media(max-width:600px){

    .question{
        font-size:30px;
    }

    .controls{
        flex-direction:column;
    }

    .controls button{
        width:100%;
    }
}
</style>
</head>
<body>

<div class="container">

<h1>🎓 Luyện Toán Nhanh</h1>

<div class="settings">

    <select id="operator">
        <option value="random">🎲 Ngẫu nhiên + - × ÷</option>
        <option value="+">➕ Cộng</option>
        <option value="-">➖ Trừ</option>
        <option value="*">✖️ Nhân</option>
        <option value="/">➗ Chia</option>
    </select>

    <select id="mode">
        <option value="essay">✍️ Tự luận</option>
        <option value="quiz">✅ Trắc nghiệm</option>
    </select>

    <select id="timerMode">
        <option value="on">⏰ Bật Timer</option>
        <option value="off">♾️ Tắt Timer</option>
    </select>

</div>

<div id="levelInfo"></div>

<div class="timer">
    <div class="timer-text">
        ⏰ Còn lại:
        <span id="time">15</span>
    </div>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>
</div>

<div id="question" class="question">
    Nhấn "Câu mới"
</div>

<div id="answerArea" class="answer-area"></div>

<div id="status" class="status"></div>

<div class="controls">
    <button class="new-btn" onclick="generateQuestion()">
        ➡️ Câu mới
    </button>

    <button class="retry-btn" onclick="restartCurrentQuestion()">
        🔄 Làm lại câu
    </button>

    <button class="reset-btn" onclick="resetScore()">
        🗑️ Đặt lại điểm
    </button>
</div>

<div class="score">
    ✅ Đúng:
    <span id="correct" class="correct">0</span>
    |
    ❌ Sai:
    <span id="wrong" class="wrong">0</span>
</div>

</div>

<script>

let answer = 0;
let correct = 0;
let wrong = 0;
let timer = null;
let timeLimit = 15;

let currentA = 0;
let currentB = 0;
let currentOp = "+";

function randomNumber(digits){

    if(digits === 1){
        return Math.floor(Math.random() * 10);
    }

    const min = Math.pow(10, digits - 1);
    const max = Math.pow(10, digits) - 1;

    return Math.floor(
        Math.random() * (max - min + 1)
    ) + min;
}

function playSound(type){

    try{

        const audioCtx =
        new (window.AudioContext ||
        window.webkitAudioContext)();

        const osc =
        audioCtx.createOscillator();

        const gain =
        audioCtx.createGain();

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if(type === "correct"){
            osc.frequency.value = 900;
        }
        else if(type === "wrong"){
            osc.frequency.value = 220;
        }
        else{
            osc.frequency.value = 120;
        }

        osc.type = "sine";

        gain.gain.value = 0.2;

        osc.start();

        osc.stop(audioCtx.currentTime + 0.25);

    }catch(err){}
}

function showStatus(message,color){

    const status =
    document.getElementById("status");

    status.innerHTML = message;
    status.style.color = color;
}

function updateScore(){

    document.getElementById("correct").textContent =
    correct;

    document.getElementById("wrong").textContent =
    wrong;
}

function startTimer(){

    clearInterval(timer);

    const timerMode =
    document.getElementById("timerMode").value;

    if(timerMode === "off"){

        document.getElementById("time").textContent =
        "∞";

        document.getElementById("progressBar")
        .style.width = "100%";

        return;
    }

    let time = timeLimit;

    document.getElementById("time").textContent =
    time;

    document.getElementById("progressBar")
    .style.width = "100%";

    timer = setInterval(()=>{

        time--;

        document.getElementById("time")
        .textContent = time;

        document.getElementById("progressBar")
        .style.width =
        (time / timeLimit * 100) + "%";

        if(time <= 0){

            clearInterval(timer);

            playSound("timeout");

            wrong++;

            updateScore();

            showStatus(
                "⏰ Hết giờ! Đáp án: " + answer,
                "#e74c3c"
            );

            setTimeout(()=>{
                generateQuestion();
            },1500);
        }

    },1000);
}

function createAnswerArea(mode){

    const area =
    document.getElementById("answerArea");

    if(mode === "essay"){

        area.innerHTML = `
            <input
                id="userAnswer"
                type="number"
                placeholder="Nhập đáp án">

            <button
                class="check-btn"
                onclick="checkEssay()">
                Kiểm tra
            </button>
        `;

        setTimeout(()=>{

            const input =
            document.getElementById("userAnswer");

            if(input){

                input.focus();

                input.addEventListener(
                    "keydown",
                    function(e){

                        if(e.key === "Enter"){
                            checkEssay();
                        }
                    }
                );
            }

        },100);

    }else{

        let options = [answer];

        while(options.length < 4){

            const fake =
            answer +
            Math.floor(Math.random()*41)-20;

            if(
                fake !== answer &&
                !options.includes(fake)
            ){
                options.push(fake);
            }
        }

        options.sort(
            ()=>Math.random()-0.5
        );

        let html =
        '<div class="answers">';

        options.forEach(item=>{

            html += `
            <button
            onclick="checkQuiz(${item})">
            ${item}
            </button>`;
        });

        html += "</div>";

        area.innerHTML = html;
    }
}

function generateQuestion(){

    clearInterval(timer);

    const digits =
    Math.floor(Math.random() * 4) + 1;

    document.getElementById("levelInfo")
    .innerHTML =
    `📏 Số chữ số ngẫu nhiên: ${digits}`;

    let op =
    document.getElementById("operator").value;

    const mode =
    document.getElementById("mode").value;

    if(op === "random"){

        const ops =
        ["+","-","*","/"];

        op =
        ops[
            Math.floor(
                Math.random()*ops.length
            )
        ];
    }

    let a =
    randomNumber(digits);

    let b =
    randomNumber(digits);

    switch(op){

        case "+":
            answer = a + b;
            break;

        case "-":

            if(a < b){
                [a,b] = [b,a];
            }

            answer = a - b;
            break;

        case "*":

            answer = a * b;
            break;

        case "/":

            do{
                b =
                randomNumber(
                    Math.max(
                        1,
                        digits - 1
                    )
                );
            }
            while(b === 0);

            answer =
            randomNumber(digits);

            a = answer * b;

            break;
    }

    currentA = a;
    currentB = b;
    currentOp = op;

    document.getElementById("question")
    .innerHTML =
    `${a} ${op} ${b} = ?`;

    showStatus("", "");

    createAnswerArea(mode);

    startTimer();
}

function processAnswer(isCorrect){

    clearInterval(timer);

    if(isCorrect){

        playSound("correct");

        correct++;

        showStatus(
            "✅ Chính xác!",
            "#27ae60"
        );

    }else{

        playSound("wrong");

        wrong++;

        showStatus(
            "❌ Sai! Đáp án đúng là " + answer,
            "#e74c3c"
        );
    }

    updateScore();

    setTimeout(()=>{
        generateQuestion();
    },1200);
}

function checkEssay(){

    const value =
    Number(
        document.getElementById(
            "userAnswer"
        ).value
    );

    processAnswer(
        value === answer
    );
}

function checkQuiz(value){

    processAnswer(
        value === answer
    );
}

function restartCurrentQuestion(){

    document.getElementById("question")
    .innerHTML =
    `${currentA} ${currentOp} ${currentB} = ?`;

    const input =
    document.getElementById(
        "userAnswer"
    );

    if(input){

        input.value = "";
        input.focus();
    }

    showStatus("", "");

    startTimer();
}

function resetScore(){

    correct = 0;
    wrong = 0;

    updateScore();

    showStatus(
        "🔄 Đã đặt lại điểm",
        "#3498db"
    );
}

generateQuestion();

</script>

</body>
</html>
